<!doctype html>
<html lang="sk" data-design="e">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuchárka pre Tami</title>
<link rel="stylesheet" href="css/fonts.css">

<link rel="stylesheet" href="css/shop.css">

<script>
// apply saved theme + language before first paint
try{var d=localStorage.getItem('tami.design')||'e';if(d==='a')d='e';var p=localStorage.getItem('tami.pal')||'',l=localStorage.getItem('tami.lang')||'sk';document.documentElement.dataset.design=d;document.documentElement.lang=l;if(p)document.documentElement.dataset.pal=p;}catch(e){}
</script>
</head>
<body>
<div class="shell">
  <aside id="toc" class="toc"></aside>
  <div class="main">
    <header id="top" class="top"></header>
    <main id="view" class="view"></main>
    <footer id="foot" class="foot"></footer>
  </div>
</div>
<div id="palpanel" class="palpanel" hidden></div>
<script src="js/i18n.js"></script>
<script src="js/themes.js"></script>
<script src="js/shop.js"></script>
<script src="js/about.js"></script>
<script src="js/imgload.js"></script>

</body>
</html>
